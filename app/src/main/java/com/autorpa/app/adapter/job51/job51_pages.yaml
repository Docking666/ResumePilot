# 51job 引导截图配置
platform: "51job"
package: "com.inc.andapp.51job"
version: 1

pages:
  - key: "home"
    title: "首页"
    instruction: "请打开 51job App，停留在首页，确保可以看到搜索框和底部Tab栏"
    description: "51job首页，顶部有搜索框和地区选择，中部是职位推荐/功能入口，底部有Tab导航栏"
    required: true
    order: 1

  - key: "search_result"
    title: "搜索结果页"
    instruction: "请在搜索框输入任意关键词（如'Java'），进入搜索结果页后截图"
    description: "搜索结果列表页，包含职位卡片（标题、公司名、薪资范围、地点、发布时间），顶部有筛选条件"
    required: true
    order: 2

  - key: "job_detail"
    title: "职位详情页"
    instruction: "请点击任意职位卡片，进入详情页后截图"
    description: "职位详情页，包含公司介绍、职位描述、任职要求、薪资福利，底部有操作栏（投递简历/收藏/分享）"
    required: true
    order: 3

  - key: "apply_page"
    title: "投递页"
    instruction: "请点击底部'投递简历'按钮，进入投递确认页后截图"
    description: "投递确认页，可能有简历版本选择、是否附言等选项，需要确认投递"
    required: true
    order: 4

  - key: "chat_list"
    title: "消息列表"
    instruction: "请返回消息/投递记录Tab，查看已投递的职位列表，截图"
    description: "投递记录/消息列表页，显示已投递的职位和状态"
    required: false
    order: 5